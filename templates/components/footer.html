<style>
    /* =============================== */
/* Footer */
.site-footer {
    background-color: #1E3A8A;
    color: #fff;
    padding: 40px 20px 20px 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.footer-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
}

.footer-logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.footer-logo img {
    height: 40px;
}

.footer-logo span {
    font-size: 1.1rem;
    font-weight: bold;
}

.footer-links,
.footer-social {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.footer-links a,
.footer-social a {
    color: #fff;
    text-decoration: none;
    transition: color 0.3s;
}

.footer-links a:hover,
.footer-social a:hover {
    color: #93C5FD;
}

.footer-bottom {
    text-align: center;
    margin-top: 20px;
    font-size: 0.9rem;
    color: #e0e0e0;
    border-top: 1px solid rgba(255,255,255,0.2);
    padding-top: 10px;
}

/* Responsividade */
@media (max-width: 768px) {
    .footer-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .footer-links,
    .footer-social {
        justify-content: center;
    }
}

</style>
<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-logo">
            <img src="{% static 'images/unifapBranca.png' %}" alt="Logo UNIFAP">
            <span>Sistema de Reserva de Salas</span>
        </div>

        <div class="footer-links">
            <a href="{% url 'home' %}">Início</a>
            <a href="{% url 'registredRooms' %}">Salas</a>
            <a href="{% url 'buildings' %}">Prédios</a>
            <a href="{% url 'contact' %}">Contato</a>
        </div>

        <div class="footer-social">
            <a href="#" target="_blank">Facebook</a>
            <a href="#" target="_blank">Instagram</a>
            <a href="#" target="_blank">LinkedIn</a>
        </div>
    </div>

    <div class="footer-bottom">
        <p>&copy; {{ current_year }} Sistema de Reserva de Salas - Todos os direitos reservados</p>
    </div>
</footer>
